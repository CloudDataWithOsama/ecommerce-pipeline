name: Deploy Medallion Pipelines to Databricks

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Deploy Sub-folders Based on Branch
        run: |
          # Credentials setup
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = ${{ secrets.DATABRICKS_HOST }}" >> ~/.databrickscfg
          echo "token = ${{ secrets.DATABRICKS_TOKEN }}" >> ~/.databrickscfg

          # Detect active branch
          BRANCH_NAME="${GITHUB_REF_NAME}"
          
          if [ "$BRANCH_NAME" == "main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi

          TARGET_PATH="/Users/osamahashmi28@gmail.com/Ecommerce_Pipeline/${ENV}/medalion_processing"
          
          echo "Deploying branch '${BRANCH_NAME}' to environment '${ENV}' at path: ${TARGET_PATH}"

          # Workspace Directory create karein
          databricks workspace mkdirs "$TARGET_PATH" || true
          
          # Complete src directory sync karein
          databricks workspace import_dir \
            --overwrite \
            ./src \
            "$TARGET_PATH"
          
          echo "Successfully synced to $TARGET_PATH"