name: Deploy Medallion Pipelines to Databricks

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          pip install databricks-cli

      - name: Deploy All Sub-folders to User Workspace Path
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          TARGET_PATH="/Users/osamahashmi28@gmail.com/Ecommerce_Pipeline/medalion_processing"
          
          # Target Folder create karein agar na ho
          databricks workspace mkdirs "$TARGET_PATH" || true
          
          # Complete src directory sync karein
          databricks workspace import_dir \
            --overwrite \
            ./src \
            "$TARGET_PATH"
          
          echo "Successfully synced to $TARGET_PATH"